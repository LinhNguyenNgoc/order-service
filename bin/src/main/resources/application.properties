spring.application.name=order-service

server.port=8082

# PostgreSQL Configuration (Database order_db)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Bootstrap Server (Dùng biến môi trường, fallback về localhost cho chạy local)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-group

# Actuator & Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Tắt đẩy OTLP metrics lên localhost gây lỗi Connection refused
management.otlp.metrics.export.enabled=false

# Tracing to Tempo (Dùng biến môi trường, fallback về localhost cho chạy local)
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4317}

# Logging format kèm TraceId và SpanId để correlate với Tempo
logging.pattern.level=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n
